services:
  kodo:
    build:
      context: .
      dockerfile: Dockerfile
    image: kodo-nav2-patrol:latest
    container_name: kodo
    environment:
      - DISPLAY
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - .:/ros2_ws:rw
    network_mode: host
    privileged: true
    stdin_open: true
    tty: true
    command: bash
