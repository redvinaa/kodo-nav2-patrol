services:
  kodo:
    build:
      context: .
      dockerfile: Dockerfile
    image: kodo-nav2-patrol:latest
    container_name: kodo
    # Allow GUI applications (Gazebo, RViz) via X11
    environment:
      - DISPLAY=${DISPLAY:-:0}
      - QT_X11_NO_MITSHM=1
      - TURTLEBOT3_MODEL=waffle
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - .:/ros2_ws:rw
    network_mode: host
    privileged: true
    stdin_open: true
    tty: true
    command: bash
